<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guess Rizal: Life & Works</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#F5E6C8;
    --parchment-deep:#ecd8a8;
    --parchment-edge:#d8be86;
    --cream:#FFF8E7;
    --cream-deep:#f2e4bf;
    --maroon:#6B4F3A;
    --maroon-deep:#3B2A1A;
    --gold:#a9823f;
    --gold-bright:#C8A96B;
    --ink:#3B2A1A;
    --ink-soft:#6B4F3A;
    --display:'Cinzel', serif;
    --script:'Cormorant Garamond', serif;
    --body:'Libre Baskerville', 'Georgia', serif;
    --heading:'Playfair Display', serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse at top left, rgba(122,31,43,0.05), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(168,121,31,0.07), transparent 55%),
      var(--parchment);
    color:var(--ink);
    font-family:var(--body);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:0;
    opacity:0.5;
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, transparent 1px, transparent 2px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.012) 0px, transparent 1px, transparent 3px);
  }

  .stage{
    width:100%;
    max-width:660px;
    background:linear-gradient(180deg, #fbf5e6, #f6ecd7);
    border:1px solid var(--parchment-edge);
    border-radius:6px;
    position:relative;
    z-index:1;
    box-shadow:0 24px 60px rgba(42,31,20,0.18);
    animation:riseIn .6s ease both;
  }
  @keyframes riseIn{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }
  .stage::before{
    content:"";
    position:absolute;
    top:9px; left:9px; right:9px; bottom:9px;
    border:1px solid rgba(168,121,31,0.35);
    border-radius:3px;
    pointer-events:none;
  }

  header{
    padding:26px 32px 18px;
    border-bottom:2px double var(--gold);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
  }
  header h1{
    font-family:var(--heading);
    font-size:19px;
    font-weight:600;
    letter-spacing:0.03em;
    margin:0;
    color:var(--maroon-deep);
  }
  header .byline{
    font-family:var(--script);
    font-style:italic;
    font-size:14.5px;
    color:var(--ink-soft);
    display:block;
    margin-top:5px;
    font-weight:400;
  }
  header .home-link{
    font-family:var(--display);
    font-size:10.5px;
    letter-spacing:0.1em;
    text-decoration:none;
    color:var(--maroon);
    border:1px solid var(--gold);
    padding:7px 12px;
    border-radius:2px;
    white-space:nowrap;
    transition:background .2s ease;
  }
  header .home-link:hover{background:rgba(168,121,31,0.1);}

  .content{padding:30px 32px 32px;}

  .level-track{
    display:flex;
    gap:6px;
    margin-bottom:20px;
  }
  .level-pill{
    flex:1;
    text-align:center;
    padding:8px 4px;
    font-family:var(--display);
    font-size:10px;
    letter-spacing:0.06em;
    border-radius:3px;
    color:var(--maroon-deep);
    background:var(--cream-deep);
    border:1px solid transparent;
    transition:all .3s ease;
  }
  .level-pill.active{background:var(--maroon); color:var(--parchment); border-color:var(--maroon-deep);}
  .level-pill.done{background:var(--gold-bright); color:var(--maroon-deep);}

  .dots{display:flex;gap:7px;margin-bottom:22px;}
  .dots i{
    width:7px;height:7px;border-radius:50%;
    background:var(--parchment-edge);
    display:block;
    transition:all .3s ease;
  }
  .dots i.done{background:var(--gold-bright);}
  .dots i.current{background:var(--maroon); transform:scale(1.3);}

  .scene{
    width:100%;
    aspect-ratio:16/9;
    background:var(--cream-deep);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:22px;
    position:relative;
    border:1px solid var(--parchment-edge);
    box-shadow:inset 0 0 0 6px #fbf5e6;
  }
  .scene::after{
    content:"";
    position:absolute; inset:0;
    box-shadow:inset 0 0 40px rgba(42,31,20,0.18);
    pointer-events:none;
  }
  .scene img{
    width:100%;
    height:100%;
    object-fit:contain;
    filter:sepia(0.15) contrast(1.02);
  }

  .qtext{
    font-family:var(--script);
    font-style:italic;
    font-weight:600;
    font-size:23px;
    line-height:1.4;
    color:var(--ink);
    margin-bottom:20px;
  }

  .choices{display:grid;gap:10px;margin-bottom:4px;}
  .choice{
    text-align:left;
    font-family:var(--body);
    font-size:15px;
    padding:13px 16px;
    background:var(--cream);
    border:1px solid var(--parchment-edge);
    border-radius:4px;
    cursor:pointer;
    color:var(--ink);
    transition:background .18s ease, transform .12s ease, border-color .18s ease;
    position:relative;
  }
  .choice:hover:not(:disabled){background:var(--cream-deep); transform:translateX(3px); border-color:var(--gold);}
  .choice.correct{
    background:rgba(201,162,39,0.28);
    border-color:var(--gold-bright);
    font-weight:600;
    animation:pulseCorrect .5s ease;
  }
  @keyframes pulseCorrect{
    0%{box-shadow:0 0 0 0 rgba(201,162,39,0.5);}
    100%{box-shadow:0 0 0 8px rgba(201,162,39,0);}
  }
  .choice.wrong{background:rgba(122,31,43,0.1); border-color:rgba(122,31,43,0.3); opacity:0.65;}
  .choice:disabled{cursor:default;}

  .feedback{
    margin-top:18px;
    padding:16px 18px;
    background:var(--maroon-deep);
    color:var(--parchment);
    border-radius:4px;
    font-size:14.5px;
    line-height:1.65;
    animation:fadeSlide .4s ease both;
  }
  @keyframes fadeSlide{
    from{opacity:0; transform:translateY(-6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .feedback .verdict{
    font-family:var(--display);
    font-size:12px;
    letter-spacing:0.1em;
    font-weight:600;
    margin-bottom:6px;
    color:var(--gold-bright);
    text-transform:uppercase;
  }

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .score-tag{
    font-family:var(--display);
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--maroon-deep);
  }

  button.primary{
    font-family:var(--display);
    letter-spacing:0.08em;
    background:var(--maroon);
    color:var(--parchment);
    border:1px solid var(--maroon-deep);
    border-radius:3px;
    padding:12px 26px;
    font-size:12px;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    box-shadow:0 6px 16px rgba(122,31,43,0.3);
  }
  button.primary:hover:not(:disabled){transform:translateY(-2px); box-shadow:0 10px 22px rgba(122,31,43,0.4);}
  button.primary:disabled{opacity:0.35; cursor:default; box-shadow:none;}

  .lede{font-size:15.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:24px;}
  .lede::first-letter{
    font-family:var(--display);
    font-size:2.6em;
    float:left;
    line-height:0.75;
    padding:4px 8px 0 0;
    color:var(--maroon);
  }

  .intro-badge{
    display:inline-block;
    font-family:var(--display);
    font-size:10.5px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--maroon);
    border-bottom:1px solid var(--gold);
    padding-bottom:6px;
    margin-bottom:18px;
  }

  .level-title{
    font-family:var(--script);
    font-style:italic;
    font-weight:600;
    font-size:26px;
    margin:2px 0 10px;
    color:var(--maroon-deep);
  }
  .end-score{
    font-family:var(--display);
    font-size:48px;
    font-weight:600;
    margin:8px 0;
    color:var(--maroon-deep);
    letter-spacing:0.02em;
  }
  .reflect p{
    font-size:15px;
    line-height:1.7;
    margin-top:10px;
    color:var(--ink-soft);
    font-family:var(--script);
    font-style:italic;
    font-size:19px;
  }

  hr.flourish{
    border:none;
    text-align:center;
    margin:22px 0;
  }
  hr.flourish::before{
    content:"❦";
    display:block;
    font-size:15px;
    color:var(--gold);
    text-align:center;
    position:relative;
  }
  hr.flourish::after{
    content:"";
    display:block;
    height:1px;
    width:100%;
    background:linear-gradient(90deg, transparent, var(--gold-bright) 50%, transparent);
    margin-top:-11px;
    z-index:-1;
  }

  @media (max-width:520px){
    header{padding:20px 22px 14px;}
    .content{padding:22px 22px 26px;}
    .qtext{font-size:20px;}
  }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div>
      <h1>Guess Rizal: Life &amp; Works</h1>
      <span class="byline">by Justin Christian Cacanindin</span>
    </div>
    <a class="home-link" href="index.html">&larr; His Story</a>
  </header>
  <div class="content" id="app"></div>
</div>

<script>
const LEVELS = [
  {
    name:"Early Life",
    questions:[
      {
        scene:"house",
        q:"Rizal was born in this riverside town in Laguna in 1861 — where?",
        choices:[
          {label:"Calamba", correct:true},
          {label:"Dapitan", correct:false},
          {label:"Malolos", correct:false},
          {label:"Vigan", correct:false},
        ],
        fact:"Rizal was born on June 19, 1861, in Calamba, Laguna, the seventh of eleven children of Francisco Mercado and Teodora Alonso."
      },
      {
        scene:"family",
        q:"Where did Rizal fall among his eleven brothers and sisters?",
        choices:[
          {label:"The seventh child", correct:true},
          {label:"The eldest child", correct:false},
          {label:"An only child", correct:false},
          {label:"The youngest child", correct:false},
        ],
        fact:"He was the seventh of eleven children — his eldest sister Saturnina was born first, and his younger sister Soledad was the last."
      },
      {
        scene:"candle-book",
        q:"His mother, Teodora Alonso, is widely credited with teaching him what — at a very young age?",
        choices:[
          {label:"To read and love books", correct:true},
          {label:"To fence with a sword", correct:false},
          {label:"To navigate by the stars", correct:false},
          {label:"To paint portraits", correct:false},
        ],
        fact:"Teodora Alonso was well-educated for her time and personally taught young Rizal his letters, sparking the lifelong love of reading that shaped his later works."
      },
    ]
  },
  {
    name:"Education & Works",
    questions:[
      {
        scene:"eye-chart",
        q:"Rizal studied medicine in Spain, specializing in which field?",
        choices:[
          {label:"Ophthalmology (eye medicine)", correct:true},
          {label:"Cardiology", correct:false},
          {label:"Dentistry", correct:false},
          {label:"Pediatrics", correct:false},
        ],
        fact:"He specialized in ophthalmology partly because his mother was losing her eyesight — he later performed eye surgery on her in the Philippines."
      },
      {
        scene:"quill-globe",
        q:"Rizal wrote his first novel, Noli Me Tángere, while living where?",
        choices:[
          {label:"Berlin, Germany", correct:true},
          {label:"Manila, Philippines", correct:false},
          {label:"Tokyo, Japan", correct:false},
          {label:"New York, USA", correct:false},
        ],
        fact:"Rizal completed and published Noli Me Tángere in Berlin in 1887, using savings and help from a friend, Maximo Viola, to print it."
      },
      {
        scene:"two-books",
        q:"What is the title of Rizal's sequel to Noli Me Tángere?",
        choices:[
          {label:"El Filibusterismo", correct:true},
          {label:"Mi Último Adiós", correct:false},
          {label:"Makamisa", correct:false},
          {label:"La Solidaridad", correct:false},
        ],
        fact:"El Filibusterismo (1891) is the darker, more radical sequel, following Noli's protagonist years later under a new identity."
      },
      {
        scene:"speech-bubbles",
        q:"Rizal was famously a polyglot. Roughly how many languages could he use?",
        choices:[
          {label:"More than 20", correct:true},
          {label:"Exactly 2", correct:false},
          {label:"5, all Philippine languages", correct:false},
          {label:"None besides Spanish", correct:false},
        ],
        fact:"Estimates vary, but Rizal is widely documented to have studied and used over twenty languages, including Tagalog, Spanish, German, French, English, and Japanese."
      },
    ]
  },
  {
    name:"Legacy & Sacrifice",
    questions:[
      {
        scene:"circle-people",
        q:"In 1892, Rizal founded this civic organization promoting unity and reform.",
        choices:[
          {label:"La Liga Filipina", correct:true},
          {label:"The Katipunan", correct:false},
          {label:"Cofradia de San Jose", correct:false},
          {label:"Comite de Propaganda", correct:false},
        ],
        fact:"La Liga Filipina aimed to unite the archipelago, promote mutual aid, and pursue reform — Rizal was arrested and exiled shortly after founding it."
      },
      {
        scene:"island",
        q:"After founding La Liga Filipina, Rizal was exiled by Spanish authorities to which remote town?",
        choices:[
          {label:"Dapitan, Zamboanga", correct:true},
          {label:"Baguio", correct:false},
          {label:"Cebu City", correct:false},
          {label:"Palawan", correct:false},
        ],
        fact:"Rizal spent four years in exile in Dapitan (1892–1896), where he practiced medicine, taught, farmed, and built a water system for the town."
      },
      {
        scene:"candle-paper",
        q:"The night before his execution, Rizal wrote this farewell poem, later smuggled out to his family.",
        choices:[
          {label:"Mi Último Adiós", correct:true},
          {label:"A Filipinas", correct:false},
          {label:"Sa Aking mga Kabata", correct:false},
          {label:"Himno al Trabajo", correct:false},
        ],
        fact:"Mi Último Adiós (\"My Last Farewell\") was written the night of December 29, 1896, and has since been translated into dozens of languages."
      },
      {
        scene:"monument",
        q:"Where was Rizal executed on December 30, 1896?",
        choices:[
          {label:"Bagumbayan (present-day Rizal Park / Luneta)", correct:true},
          {label:"Fort Pilar, Zamboanga", correct:false},
          {label:"Intramuros' Plaza Roma", correct:false},
          {label:"Malacañang grounds", correct:false},
        ],
        fact:"Rizal was executed by firing squad at Bagumbayan field, now Rizal Park in Manila, where his monument stands today."
      },
    ]
  },
];

let levelIdx = -1;
let qIdx = 0;
let totalScore = 0;
let answered = false;

const TOTAL_Q = LEVELS.reduce((s,l)=>s+l.questions.length,0);

const IMAGES = {
  house: "images/CalambaHouse.jpg" ,
  family: "images/RizalsFamily.jpg",
  "candle-book": "images/TeodoraAlonso.jpg",
  "eye-chart": "images/Opthalmology.jpg",
  "quill-globe": "images/BerlinRizal.jpg",
  "two-books": "images/NoliElfili.jpg",
  "speech-bubbles": "images/JoseRizalLanguage.jpg",
  "circle-people": "images/RizalLaliga.jpg",
  island: "images/DapitanExile.jpg",
  "candle-paper": "images/images/MiUltimoAdios.jpg",
  monument: "images/RizalMonument.jpg",
};

function render(){
  const app = document.getElementById('app');

  if(levelIdx < 0){
    app.innerHTML = `
      <div class="intro-badge">Eleven Questions &middot; Three Chapters</div>
      <p class="lede">From a riverside childhood in Calamba to a farewell poem written by candlelight — walk through the life of José Rizal, one memory at a time.</p>
      <button class="primary" onclick="startGame()">Begin the Story</button>
    `;
    return;
  }

  if(levelIdx >= LEVELS.length){
    app.innerHTML = `
      <div class="intro-badge">The Final Chapter</div>
      <h2 class="level-title">You've reached the end</h2>
      <div class="end-score">${totalScore} / ${TOTAL_Q}</div>
      <hr class="flourish">
      <div class="reflect">
        <p>From a riverside childhood in Calamba to a farewell poem written the night before execution at Bagumbayan — that's the arc of a life spent turning ideas into resistance.</p>
      </div>
      <div class="footer-row">
        <button class="primary" onclick="restart()">Play Again</button>
      </div>
    `;
    return;
  }

  const level = LEVELS[levelIdx];

  if(qIdx >= level.questions.length){
    app.innerHTML = `
      <div class="intro-badge">Chapter ${levelIdx+1} of ${LEVELS.length}</div>
      <h2 class="level-title">${level.name} complete</h2>
      <p class="lede">Score so far: ${totalScore} / ${TOTAL_Q}</p>
      <div class="footer-row">
        <button class="primary" onclick="nextLevel()">${levelIdx+1 < LEVELS.length ? 'Continue the Story' : 'See Final Result'}</button>
      </div>
    `;
    return;
  }

  const q = level.questions[qIdx];
  answered = false;

  let levelPills = LEVELS.map((l,i)=>{
    let cls = i < levelIdx ? 'done' : (i===levelIdx ? 'active' : '');
    return `<div class="level-pill ${cls}">Chapter ${i+1}</div>`;
  }).join('');

  let dotsHTML = level.questions.map((_,i)=>{
    let cls = i < qIdx ? 'done' : (i===qIdx ? 'current' : '');
    return `<i class="${cls}"></i>`;
  }).join('');

  app.innerHTML = `
    <div class="level-track">${levelPills}</div>
    <div class="dots">${dotsHTML}</div>
    <div class="scene"><img src="${IMAGES[q.scene]}" alt="${q.q}"></div>
    <div class="qtext">${q.q}</div>
    <div class="choices" id="choices">
      ${q.choices.map((c,i)=>`<button class="choice" data-i="${i}" onclick="pick(${i})">${c.label}</button>`).join('')}
    </div>
    <div id="feedbackSlot"></div>
    <div class="footer-row">
      <span class="score-tag">Score: ${totalScore} / ${TOTAL_Q}</span>
      <button class="primary" id="nextBtn" onclick="next()" disabled>Next</button>
    </div>
  `;
}

function pick(i){
  if(answered) return;
  answered = true;
  const level = LEVELS[levelIdx];
  const q = level.questions[qIdx];
  const buttons = document.querySelectorAll('#choices .choice');
  buttons.forEach((b,bi)=>{
    b.disabled = true;
    if(q.choices[bi].correct) b.classList.add('correct');
    else if(bi===i) b.classList.add('wrong');
  });
  const isRight = q.choices[i].correct;
  if(isRight) totalScore++;
  document.getElementById('feedbackSlot').innerHTML = `
    <div class="feedback">
      <div class="verdict">${isRight ? 'Correct' : 'Not quite'}</div>
      <div>${q.fact}</div>
    </div>
  `;
  document.getElementById('nextBtn').disabled = false;
}

function next(){ qIdx++; render(); }
function nextLevel(){ levelIdx++; qIdx = 0; render(); }
function startGame(){ levelIdx = 0; qIdx = 0; totalScore = 0; render(); }
function restart(){ levelIdx = -1; qIdx = 0; totalScore = 0; render(); }

render();
</script>
</body>
</html>
